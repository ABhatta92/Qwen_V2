[project]
name = "qwen-v2"
version = "0.2.0"
description = "Local Qwen agent built with Google's Agent Development Kit (ADK)."
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [
    { name = "ABhatta92" },
]
dependencies = [
    "google-adk[extensions]>=2.0.0,<3.0.0",
    "mcp>=1.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.13,<0.14",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
